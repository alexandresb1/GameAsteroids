<div id="startScreenOverlay" class="interface-overlay">
    <div class="start-screen-container">
        <img src="assets/images/AsteroidsLogo.png" 
             alt="Asteroids Logo" 
             class="game-logo">

        <!-- Botões do menu -->
        <div class="menu-buttons">
            <button id="startGameBtn" class="menu-button">
                <span class="button-icon"><i class="fas fa-play"></i></span>
                <span class="button-text">JOGAR</span>
            </button>
            
            <button id="customizeBtn" class="menu-button">
                <span class="button-icon"><i class="fas fa-palette"></i></span>
                <span class="button-text">PERSONALIZAR</span>
            </button>
            
            <button id="helpBtn" class="menu-button">
                <span class="button-icon"><i class="fas fa-question"></i></span>
                <span class="button-text">COMO JOGAR</span>
            </button>

            <button id="settingsBtn" class="menu-button">
                <span class="button-icon"><i class="fas fa-cog"></i></span>
                <span class="button-text">CONFIGURAÇÕES</span>
            </button>

            <!-- Toggle Modo Mobile -->
            <button id="mobileToggleBtn" class="menu-button">
                <span class="button-icon"><i class="fas fa-mobile-alt"></i></span>
                <span class="button-text">MODO MOBILE: <span id="mobileToggleStatus">OFF</span></span>
            </button>

            <!-- Botão de Áudio -->
            <button id="audioToggleMenuBtn" class="menu-button" data-audio-status="active">
                <span class="button-icon"><i class="fas fa-volume-up"></i></span>
                <span class="button-text">ÁUDIO: <span id="audioToggleStatus">ATIVADO</span></span>
            </button>
        </div>
    </div>
</div>
